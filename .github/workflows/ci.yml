# Shadowfax CI (v0.13; publishing from v0.17; signing from v0.20).
#
# The jobs, and the question each one answers.
#
#   checks     Does the engine behave? 300+ assertions in-process, plus a
#              dashboard build, because a broken component is a broken product
#              even when every Python test passes.
#
#   container  Does the thing people are told to run actually run? It builds the
#              image, starts it, and replays a scripted attack against it over
#              real HTTP, asserting that the detections the README claims
#              actually happen. A README that says `docker compose up` and a
#              Dockerfile nobody builds is a promise with nothing behind it.
#
#   desktop    (v0.38) The desktop app: unit tests, the real app end to end
#              against this commit's server, then the Linux package built and
#              checked. desktop-windows builds the Windows installer on Windows
#              and installs it. On a release, desktop-release attaches both.
#
#   publish    Only when a GitHub release is published. Only after both jobs
#              above have passed on that exact commit. Pushes the image to
#              ghcr.io, signs it, verifies the signature, then pulls back what
#              was published and checks it -- the thing people will run, not
#              the thing that was built.
#
# The second job is the one that earns its keep. The unit suite never leaves the
# process; this exercises ingest, twenty-two detectors, correlation, kill-chain
# ordering, findings-envelope ingest, the sign-in throttle and the hash-chained
# ledger, against a real server, in the image that ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a release on github.com (Releases -> Draft a new release) is what
  # ships an image. Pushing to main never does.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run irrelevant; let it go rather than
  # queueing results nobody will read.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test suite and dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v0.32: a PostgreSQL server for the second run of the suite. The official
    # image defaults to an en_US locale, which is the case worth testing: text
    # has to sort the way SQLite sorts it there too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadowfax
          POSTGRES_PASSWORD: shadowfax-ci
          POSTGRES_DB: shadowfax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowfax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend and test dependencies
        # requirements-dev.txt pulls in requirements.txt and adds what only the
        # suite needs. The container job deliberately installs neither: it tests
        # the shipped image, whose dependencies are requirements.txt alone.
        run: pip install -r requirements-dev.txt

      - name: Run the test suite
        # Exits non-zero on the first failure and names the check that broke.
        run: python test_api.py

      - name: Run the test suite on PostgreSQL
        # The same suite again, with the database swapped. A throwaway CI
        # database, so the password here protects nothing.
        env:
          SHADOWFAX_DATABASE_URL: postgresql://shadowfax:shadowfax-ci@localhost:5432/shadowfax_test
        run: python test_api.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build the dashboard
        run: npm run build
        working-directory: frontend

  container:
    name: Packaged image, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the image
        # Exactly what `docker compose up --build` does, so a broken Dockerfile
        # fails here rather than on someone else's first try.
        run: docker build -t shadowfax:ci .

      - name: Start it
        run: |
          docker run -d --name shadowfax -p 8000:8000 \
            -e SHADOWFAX_ADMIN_USERNAME=admin \
            -e SHADOWFAX_ADMIN_PASSWORD=admin \
            shadowfax:ci

      - name: Wait for it to report healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy; container log follows:"
          docker logs shadowfax
          exit 1

      - name: It runs as a non-root user
        # A tool that spends its time reporting privilege escalation should not
        # need root to say it.
        run: |
          whoami_in_container=$(docker exec shadowfax whoami)
          echo "running as: ${whoami_in_container}"
          test "${whoami_in_container}" != "root"

      - name: The dashboard is served from the API's own origin
        # One process, one port. If this regressed, the image would still start
        # and still answer the API while serving nothing a person could use.
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'

      - name: An API route is not shadowed by the dashboard mount
        # 401 means the endpoint answered and demanded a credential. A 404 would
        # mean the static mount had swallowed it.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/alerts)
          echo "GET /alerts -> ${code}"
          test "${code}" = "401"

      - name: Replay a scripted attack, and assert what it must detect
        # The real test. Ingest, detection, correlation, kill-chain ordering,
        # findings-envelope ingest, the front door and the ledger -- over HTTP,
        # against the image that ships. Non-zero if any step fails to raise what
        # the narration said it would.
        run: python demo.py --fast --assert --no-colour

      - name: Check the dashboard in a real browser
        # Building the dashboard proves it compiles, not that it works: Vite
        # exits 0 on a page that renders nothing. These assertions are what a
        # person checks at a glance -- that the alerts the engine found are on
        # screen, that an ingested finding names its emitter, that the kill
        # chain is drawn and the ledger badge reads verified. The replay above
        # is what put the data there.
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python test_dashboard.py --url http://127.0.0.1:8000

      - name: The CLI can gate on what it found
        # `check` exits non-zero WHEN ALERTS MATCH -- the inversion that lets an
        # agent harness fail its own build. The replay leaves criticals behind,
        # so a zero exit here would mean the gate had stopped working.
        env:
          SHADOWFAX_PASSWORD: admin
          SHADOWFAX_URL: http://127.0.0.1:8000
        run: |
          python cli.py login -u admin
          python cli.py verify
          if python cli.py check --severity critical; then
            echo "check exited 0 with critical alerts present — the gate is broken"
            exit 1
          fi
          echo "check correctly exited non-zero on matching alerts"

      - name: The image does not ship a known password
        # v0.17: the image is published, so anyone can run it. Started without
        # SHADOWFAX_ADMIN_PASSWORD it must refuse admin/admin and instead print
        # a generated password that works. Checked on a second, fresh container
        # -- the one above was given credentials on purpose.
        run: |
          docker run -d --name fresh -p 8001:8000 shadowfax:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/healthz > /dev/null && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' \
            http://127.0.0.1:8001/auth/login)
          echo "admin/admin on a fresh image -> ${code}"
          test "${code}" = "401"
          # Read from a file rather than a pipe: the runner uses pipefail, and a
          # reader that stops early would fail the step on SIGPIPE.
          docker logs fresh > fresh.log 2>&1
          generated=$(awk '/^ *password: /{print $2; exit}' fresh.log)
          test -n "${generated}" || { echo "no generated password in the log"; cat fresh.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"${generated}\"}" \
            http://127.0.0.1:8001/auth/login)
          echo "the generated password -> ${code}"
          test "${code}" = "200"
          docker rm -f fresh

      - name: The PostgreSQL setup works as the deployment guide says (v0.34)
        # docker-compose.postgres.yml exactly as docs/deployment.md tells
        # people to run it: one command, a generated database password nobody
        # types, the admin password from the log. Then the scripted attack
        # against it, a check that the events really are in PostgreSQL, and a
        # restart to show the data and the password survive it.
        env:
          SHADOWFAX_PORT: "8100"
        run: |
          set -eu
          dc() { docker compose -f docker-compose.postgres.yml "$@"; }
          wait_healthy() {
            for _ in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8100/healthz > /dev/null && return 0
              sleep 2
            done
            echo "the PostgreSQL stack never became healthy"; dc logs; return 1
          }
          dc up -d --build
          wait_healthy
          dc logs --no-log-prefix shadowfax > pg-stack.log 2>&1
          generated=$(awk '/^ *password: /{print $2; exit}' pg-stack.log)
          test -n "${generated}" || { echo "no generated password in the log"; cat pg-stack.log; exit 1; }
          python demo.py --fast --assert --no-colour --url http://127.0.0.1:8100 \
            --username admin --password "${generated}"
          events=$(dc exec -T db psql -U shadowfax -d shadowfax -Atc "SELECT COUNT(*) FROM events")
          echo "events stored in PostgreSQL: ${events}"
          test "${events}" -gt 0
          dc restart
          wait_healthy
          SHADOWFAX_PASSWORD="${generated}" python cli.py --url http://127.0.0.1:8100 login -u admin
          python cli.py --url http://127.0.0.1:8100 verify
          dc exec -T db pg_dump -U shadowfax -d shadowfax --clean --if-exists -f /backups/ci.sql
          test -s backups/ci.sql
          dc down -v

      - name: Container log
        if: always()
        run: docker logs shadowfax

  desktop:
    name: Desktop app, end to end
    # v0.38. The real Electron app against a real server started from this
    # commit, under a virtual screen: the connect window, the dashboard, the
    # navigation lock, notifications. Then the Linux package is built and
    # checked from outside, because the packaged app switches off the inspector
    # the end-to-end tests drive it through.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHADOWFAX_URL: http://127.0.0.1:8000
      SHADOWFAX_ADMIN_USERNAME: admin
      SHADOWFAX_ADMIN_PASSWORD: desktop-ci-pass-1
      # GitHub's Ubuntu machines can't create Chromium's sandbox for Electron.
      # Pages stay sandboxed by their own settings; see desktop/main.js.
      SFX_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build the dashboard the server will serve
        run: npm ci --no-audit --no-fund && VITE_API_BASE= npm run build
        working-directory: frontend

      - name: Start Shadowfax from this commit
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app:app --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS "$SHADOWFAX_URL/healthz" > /dev/null && break; sleep 1; done
          curl -fsS "$SHADOWFAX_URL/healthz"

      - name: Install the desktop app's dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Unit tests
        run: npm test
        working-directory: desktop

      - name: End-to-end tests
        run: xvfb-run -a npm run e2e
        working-directory: desktop

      - name: Build the Linux package
        run: npm run dist:linux
        working-directory: desktop

      - name: Check the packaged app
        run: xvfb-run -a node test/packaged.js dist/linux-unpacked/shadowfax-desktop
        working-directory: desktop

      - name: Server log, if anything failed
        if: failure()
        run: tail -n 100 server.log

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/dist/*.AppImage
          retention-days: 14

  desktop-windows:
    name: Desktop app, Windows installer
    # Built on Windows, where the installer is meant to run, then installed
    # silently and checked, so a broken installer fails here and not on
    # someone's PC.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npm run dist:win

      - name: Install it silently and check what landed
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "Shadowfax-Desktop-*-win-x64.exe" | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "ShadowfaxInstall"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$target" -Wait
          $exe = Join-Path $target "Shadowfax.exe"
          if (-not (Test-Path $exe)) { throw "the installer didn't put Shadowfax.exe in $target" }
          if (-not (Test-Path (Join-Path $target "Uninstall Shadowfax.exe"))) { throw "no uninstaller was installed" }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "installed $($info.ProductName) $($info.ProductVersion)"
          if ($info.ProductName -ne "Shadowfax") { throw "the installed program doesn't say it's Shadowfax" }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/Shadowfax-Desktop-*-win-x64.exe
          retention-days: 14

  desktop-release:
    name: Attach the desktop installers to the release
    # Releases only, after every other check on that commit has passed. The
    # only job allowed to write to the repository, and only to add files to the
    # release that started it.
    if: github.event_name == 'release'
    needs: [checks, container, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The release tag matches the desktop app's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          desktop=$(python3 -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          echo "tag ${TAG} | desktop/package.json ${desktop}"
          if [ "${desktop}" != "${TAG#v}" ]; then
            echo "::error::release ${TAG} does not match the desktop app's version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Upload them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -la installers
          gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish the image to ghcr.io
    # Releases only, and only what passed. `needs` means a red test suite or a
    # failed replay on this commit stops the image here rather than on someone
    # else's machine.
    if: github.event_name == 'release'
    needs: [checks, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # v0.20: lets this job ask GitHub for a short-lived identity token, which
      # is what keyless signing uses instead of a private key. No secret is
      # stored anywhere; the signature says "this workflow, at this tag".
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: The release tag matches the version the code reports
        # A release called v0.17.0 must contain a Shadowfax that says 0.17.0 in
        # every place it says anything: the API, the dashboard package and the
        # changelog. Otherwise `docker pull :0.17.0` hands someone a different
        # version wearing that number, and nothing downstream would notice.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="${TAG#v}"
          api=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app.py)
          dashboard=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          changelog=$(sed -n 's/^## Version //p' CHANGELOG.md | head -n1)
          echo "tag ${TAG} | app.py ${api} | package.json ${dashboard} | CHANGELOG ${changelog}"
          if [ "${api}" != "${want}" ] || [ "${dashboard}" != "${want}" ] || [ "${changelog}" != "${want}" ]; then
            echo "::error::release ${TAG} does not match the version in the code"
            exit 1
          fi

      - name: Name the image
        # Image names must be lowercase, and the repository is "Shadowfax".
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadowfax" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v0.17.0 -> :0.17.0, :0.17 and :latest. A release ticked "Set as a
          # pre-release" on github.com gets its own tag and never :latest. All
          # spelled out rather than left to defaults, so the tags a release
          # produces can be read here instead of looked up.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A record of how the image was built and what is inside it, attached
          # to the image itself, so "what is in this?" has an answer that does
          # not depend on trusting whoever is asking.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: cosign trades this job's GitHub identity token for a
        # short-lived certificate (Sigstore's Fulcio) naming this repository,
        # this workflow and this tag, signs the digest with it, and records the
        # signature in a public transparency log (Rekor). Anyone can later check
        # that an image came from this repository's CI at a given release --
        # not merely that someone with push access put it there.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature, as a stranger would
        # Pinned to the exact identity that should have signed: this
        # repository's ci.yml, at this release's tag, via GitHub's issuer. A
        # signature from any other workflow, fork or branch fails here.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"

      - name: Pull back what was published, and check it
        # The image that matters is the one in the registry, not the one this
        # runner happened to build. Pulled by digest, so it is exactly the
        # artifact just pushed.
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker run -d --name published -p 8000:8000 "${IMAGE}@${DIGEST}"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 2
          done
          reported=$(curl -fsS http://127.0.0.1:8000/healthz | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "published image reports ${reported}"
          test "${reported}" = "${TAG#v}"
          test "$(docker exec published whoami)" != "root"
          docker logs published > published.log 2>&1
          grep -q "generated password" published.log
          docker rm -f published

      - name: Can a stranger pull it?
        # Not a failure: the very first publish of a package is private until
        # someone makes it public, and only the repository owner can. This says
        # so plainly instead of leaving a README that tells people to pull an
        # image they are not allowed to see.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker logout ghcr.io
          if docker pull "${IMAGE}:${TAG#v}" > /dev/null 2>&1; then
            echo "public: anyone can pull ${IMAGE}:${TAG#v}"
          else
            echo "::warning::${IMAGE} is not publicly pullable yet. On github.com go to your profile -> Packages -> shadowfax -> Package settings -> Change visibility -> Public. This only needs doing once."
          fi

      - name: Summary
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}:${TAG#v}"
            echo
            echo '```bash'
            echo "docker run -d -p 8000:8000 -v shadowfax-data:/data ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Verify the signature:"
            echo '```bash'
            echo "cosign verify ${IMAGE}:${TAG#v} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
