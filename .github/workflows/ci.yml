# Shadowfax CI (v0.13; publishing from v0.17).
#
# Three jobs, answering three different questions.
#
#   checks     Does the engine behave? 300+ assertions in-process, plus a
#              dashboard build, because a broken component is a broken product
#              even when every Python test passes.
#
#   container  Does the thing people are told to run actually run? It builds the
#              image, starts it, and replays a scripted attack against it over
#              real HTTP, asserting that the detections the README claims
#              actually happen. A README that says `docker compose up` and a
#              Dockerfile nobody builds is a promise with nothing behind it.
#
#   publish    Only when a GitHub release is published. Only after both jobs
#              above have passed on that exact commit. Pushes the image to
#              ghcr.io, then pulls back what was published and checks it -- the
#              thing people will run, not the thing that was built.
#
# The second job is the one that earns its keep. The unit suite never leaves the
# process; this exercises ingest, eighteen detectors, correlation, kill-chain
# ordering, findings-envelope ingest, the sign-in throttle and the hash-chained
# ledger, against a real server, in the image that ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a release on github.com (Releases -> Draft a new release) is what
  # ships an image. Pushing to main never does.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run irrelevant; let it go rather than
  # queueing results nobody will read.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test suite and dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend and test dependencies
        # requirements-dev.txt pulls in requirements.txt and adds what only the
        # suite needs. The container job deliberately installs neither: it tests
        # the shipped image, whose dependencies are requirements.txt alone.
        run: pip install -r requirements-dev.txt

      - name: Run the test suite
        # Exits non-zero on the first failure and names the check that broke.
        run: python test_api.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build the dashboard
        run: npm run build
        working-directory: frontend

  container:
    name: Packaged image, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the image
        # Exactly what `docker compose up --build` does, so a broken Dockerfile
        # fails here rather than on someone else's first try.
        run: docker build -t shadowfax:ci .

      - name: Start it
        run: |
          docker run -d --name shadowfax -p 8000:8000 \
            -e SHADOWFAX_ADMIN_USERNAME=admin \
            -e SHADOWFAX_ADMIN_PASSWORD=admin \
            shadowfax:ci

      - name: Wait for it to report healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy; container log follows:"
          docker logs shadowfax
          exit 1

      - name: It runs as a non-root user
        # A tool that spends its time reporting privilege escalation should not
        # need root to say it.
        run: |
          whoami_in_container=$(docker exec shadowfax whoami)
          echo "running as: ${whoami_in_container}"
          test "${whoami_in_container}" != "root"

      - name: The dashboard is served from the API's own origin
        # One process, one port. If this regressed, the image would still start
        # and still answer the API while serving nothing a person could use.
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'

      - name: An API route is not shadowed by the dashboard mount
        # 401 means the endpoint answered and demanded a credential. A 404 would
        # mean the static mount had swallowed it.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/alerts)
          echo "GET /alerts -> ${code}"
          test "${code}" = "401"

      - name: Replay a scripted attack, and assert what it must detect
        # The real test. Ingest, detection, correlation, kill-chain ordering,
        # findings-envelope ingest, the front door and the ledger -- over HTTP,
        # against the image that ships. Non-zero if any step fails to raise what
        # the narration said it would.
        run: python demo.py --fast --assert --no-colour

      - name: Check the dashboard in a real browser
        # Building the dashboard proves it compiles, not that it works: Vite
        # exits 0 on a page that renders nothing. These assertions are what a
        # person checks at a glance -- that the alerts the engine found are on
        # screen, that an ingested finding names its emitter, that the kill
        # chain is drawn and the ledger badge reads verified. The replay above
        # is what put the data there.
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python test_dashboard.py --url http://127.0.0.1:8000

      - name: The CLI can gate on what it found
        # `check` exits non-zero WHEN ALERTS MATCH -- the inversion that lets an
        # agent harness fail its own build. The replay leaves criticals behind,
        # so a zero exit here would mean the gate had stopped working.
        env:
          SHADOWFAX_PASSWORD: admin
          SHADOWFAX_URL: http://127.0.0.1:8000
        run: |
          python cli.py login -u admin
          python cli.py verify
          if python cli.py check --severity critical; then
            echo "check exited 0 with critical alerts present — the gate is broken"
            exit 1
          fi
          echo "check correctly exited non-zero on matching alerts"

      - name: The image does not ship a known password
        # v0.17: the image is published, so anyone can run it. Started without
        # SHADOWFAX_ADMIN_PASSWORD it must refuse admin/admin and instead print
        # a generated password that works. Checked on a second, fresh container
        # -- the one above was given credentials on purpose.
        run: |
          docker run -d --name fresh -p 8001:8000 shadowfax:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/healthz > /dev/null && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' \
            http://127.0.0.1:8001/auth/login)
          echo "admin/admin on a fresh image -> ${code}"
          test "${code}" = "401"
          # Read from a file rather than a pipe: the runner uses pipefail, and a
          # reader that stops early would fail the step on SIGPIPE.
          docker logs fresh > fresh.log 2>&1
          generated=$(awk '/^ *password: /{print $2; exit}' fresh.log)
          test -n "${generated}" || { echo "no generated password in the log"; cat fresh.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"${generated}\"}" \
            http://127.0.0.1:8001/auth/login)
          echo "the generated password -> ${code}"
          test "${code}" = "200"
          docker rm -f fresh

      - name: Container log
        if: always()
        run: docker logs shadowfax

  publish:
    name: Publish the image to ghcr.io
    # Releases only, and only what passed. `needs` means a red test suite or a
    # failed replay on this commit stops the image here rather than on someone
    # else's machine.
    if: github.event_name == 'release'
    needs: [checks, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: The release tag matches the version the code reports
        # A release called v0.17.0 must contain a Shadowfax that says 0.17.0 in
        # every place it says anything: the API, the dashboard package and the
        # changelog. Otherwise `docker pull :0.17.0` hands someone a different
        # version wearing that number, and nothing downstream would notice.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="${TAG#v}"
          api=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app.py)
          dashboard=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          changelog=$(sed -n 's/^## Version //p' CHANGELOG.md | head -n1)
          echo "tag ${TAG} | app.py ${api} | package.json ${dashboard} | CHANGELOG ${changelog}"
          if [ "${api}" != "${want}" ] || [ "${dashboard}" != "${want}" ] || [ "${changelog}" != "${want}" ]; then
            echo "::error::release ${TAG} does not match the version in the code"
            exit 1
          fi

      - name: Name the image
        # Image names must be lowercase, and the repository is "Shadowfax".
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadowfax" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v0.17.0 -> :0.17.0, :0.17 and :latest. A release ticked "Set as a
          # pre-release" on github.com gets its own tag and never :latest. All
          # spelled out rather than left to defaults, so the tags a release
          # produces can be read here instead of looked up.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A record of how the image was built and what is inside it, attached
          # to the image itself, so "what is in this?" has an answer that does
          # not depend on trusting whoever is asking.
          provenance: mode=max
          sbom: true

      - name: Pull back what was published, and check it
        # The image that matters is the one in the registry, not the one this
        # runner happened to build. Pulled by digest, so it is exactly the
        # artifact just pushed.
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker run -d --name published -p 8000:8000 "${IMAGE}@${DIGEST}"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 2
          done
          reported=$(curl -fsS http://127.0.0.1:8000/healthz | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "published image reports ${reported}"
          test "${reported}" = "${TAG#v}"
          test "$(docker exec published whoami)" != "root"
          docker logs published > published.log 2>&1
          grep -q "generated password" published.log
          docker rm -f published

      - name: Can a stranger pull it?
        # Not a failure: the very first publish of a package is private until
        # someone makes it public, and only the repository owner can. This says
        # so plainly instead of leaving a README that tells people to pull an
        # image they are not allowed to see.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker logout ghcr.io
          if docker pull "${IMAGE}:${TAG#v}" > /dev/null 2>&1; then
            echo "public: anyone can pull ${IMAGE}:${TAG#v}"
          else
            echo "::warning::${IMAGE} is not publicly pullable yet. On github.com go to your profile -> Packages -> shadowfax -> Package settings -> Change visibility -> Public. This only needs doing once."
          fi

      - name: Summary
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}:${TAG#v}"
            echo
            echo '```bash'
            echo "docker run -d -p 8000:8000 -v shadowfax-data:/data ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
